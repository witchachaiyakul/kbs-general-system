<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0056b3">
    <title>กลุ่มบริหารงานทั่วไป</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/styles.css">
    <script type="module" src="./js/app.js"></script>
  </head>
  <body>
    <header class="site-header">
      <div class="page-width">
        <p class="eyebrow">ระบบบริหารการใช้สถานที่</p>
        <h1>กลุ่มบริหารงานทั่วไป</h1>
        <p class="muted">ระบบจองห้องประชุมและบริหารการใช้สถานที่</p>
      </div>
    </header>

    <main class="page-width">
      <div id="firebase-message" class="notice notice-error" role="alert" hidden></div>
      <div id="app-message" class="notice" role="status" aria-live="polite" hidden></div>
      <div id="component-error" class="notice notice-error" role="alert" hidden></div>

      <section id="home-view" class="panel app-view">
        <div class="home-heading">
          <div>
            <p class="eyebrow">เมนูหลัก</p>
            <h2>กลุ่มบริหารงานทั่วไป</h2>
            <p class="muted">เลือกเมนูที่ต้องการใช้งาน</p>
          </div>
        </div>
        <div class="menu-grid">
          <button class="menu-card" type="button" data-view="booking-view">
            <span class="menu-icon" aria-hidden="true">01</span>
            <span class="menu-card-title">จองห้องประชุม</span>
            <span class="menu-card-description">กรอกคำขอใช้ห้องและระบุวันเวลาที่ต้องการ</span>
            <span class="menu-card-link">เริ่มทำรายการ <span aria-hidden="true">→</span></span>
          </button>
          <button class="menu-card" type="button" data-view="bookings-view">
            <span class="menu-icon" aria-hidden="true">02</span>
            <span class="menu-card-title">ตรวจสอบรายการจอง</span>
            <span class="menu-card-description">ดูวันเวลาและสถานะของคำขอจอง</span>
            <span class="menu-card-link">ดูรายการ <span aria-hidden="true">→</span></span>
          </button>
          <button class="menu-card" type="button" data-view="admin-view">
            <span class="menu-icon" aria-hidden="true">03</span>
            <span class="menu-card-title">ผู้ดูแลระบบ</span>
            <span class="menu-card-description">เข้าสู่ระบบเพื่อจัดการคำขอจอง</span>
            <span class="menu-card-link">เข้าสู่เมนู <span aria-hidden="true">→</span></span>
          </button>
        </div>
      </section>

      <div id="component-container" aria-live="polite">
        <p id="component-loading" class="panel empty-cell">กำลังเตรียมเมนู...</p>
      </div>
    </main>

    <footer class="page-width footer">
      <span>กลุ่มบริหารงานทั่วไป</span>
      <span>บันทึกข้อมูลด้วย Firebase Firestore</span>
    </footer>
  </body>
</html>
