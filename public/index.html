<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบบริหารจัดการกลุ่มงานทั่วไป - โรงเรียนกาญจนาภิเษกวิทยาลัย กระบี่</title>

    <!-- Bootstrap 5, Bootstrap Icons, Google Fonts Sarabun -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/charts/loader.js"></script>
    
    <!-- Custom Main CSS -->
    <link rel="stylesheet" href="css/main.css">
    <script type="module" src="js/auth-guard.js"></script>
</head>
<body>

<!-- Navbar ด้านบน -->
<nav class="navbar navbar-expand-lg navbar-dark shadow-sm mb-4" style="background-color: var(--navy-dark, #0d233a); border-bottom: 2px solid var(--gold-accent, #ffc107);">
  <div class="container-fluid d-flex justify-content-between align-items-center">
    <div class="d-flex align-items-center">
      <span class="navbar-brand mb-0 h1 text-white me-2">
        <i class="bi bi-speedometer2 me-2" style="color: var(--gold-accent, #ffc107);"></i>ระบบบริหารงานทั่วไป                                                                   
      </span>
      <!-- Badge แสดงเมื่อเปิด DEV MODE -->
      <span id="devModeBadge" class="badge bg-warning text-dark d-none">
        <i class="bi bi-bug-fill me-1"></i> DEV MODE
      </span>
    </div>
    
    <!-- ส่วนแสดงโปรไฟล์ผู้ใช้งาน และ Control ใน DEV MODE -->
    <div class="d-flex align-items-center text-white" id="userHeaderProfile">
      
      <!-- Dropdown สลับ Role สำหรับทดสอบใน DEV MODE -->
      <div id="devRoleSelector" class="me-3 d-none">
        <select id="selectDevRole" class="form-select form-select-sm bg-dark text-warning border-warning">
            <option value="admin">🧪 สิทธิ์: Admin (เห็นทุกเมนู)</option>
            <option value="officer">🧪 สิทธิ์: Officer (เจ้าหน้าที่)</option>
            <option value="staff">🧪 สิทธิ์: Staff (บุคลากรทั่วไป)</option>
        </select>
      </div>

      <img id="headerUserImg" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" alt="Profile" class="rounded-circle me-2" style="width: 38px; height: 38px; object-fit: cover; border: 2px solid var(--gold-accent, #ffc107);">
      <div class="me-3 text-end">
        <div class="fw-bold small" id="headerUserName">Loading...</div>
        <small class="text-white-50 d-block" style="font-size: 11px;" id="headerUserPosition">ตำแหน่ง: -</small>
        <span class="badge bg-info text-dark" style="font-size: 10px;" id="headerUserRole">Role: -</span>
      </div>
      <button id="btnLogout" class="btn btn-outline-light btn-sm rounded-3">
        <i class="bi bi-box-arrow-right me-1"></i> ออกจากระบบ
      </button>
    </div>
  </div>
</nav>

<div class="toast-container position-fixed top-0 end-0 p-3" id="toastContainer" style="z-index: 1080;"></div>

<!-- MAIN DASHBOARD -->
<div id="mainDashboard" class="container">
  <div class="header-banner mb-4 text-center">
    <h1 class="brand-title fw-bold">KBS</h1>
    <p class="brand-subtitle text-muted">ระบบบริหารจัดการกลุ่มบริหารงานทั่วไป โรงเรียนกาญจนาภิเษกวิทยาลัย กระบี่</p>
  </div>

  <div class="row g-3 text-center justify-content-center">

    <div class="col-md-6 col-lg-3 menu-item" data-role="all">
      <div class="card menu-card h-100 shadow-sm border-0 p-3" style="cursor: pointer;" onclick="window.location.href='kbs-book-room.html'">
        <div class="icon-box fs-1 text-primary mb-2"><i class="bi bi-file-earmark-text-fill"></i></div>
        <h5>จองห้องประชุม</h5>
        <p class="small text-muted mb-0">จองห้องประชุม สถานที่</p>
      </div>
    </div>


  </div>
</div>

<!-- Firebase SDK & Custom Modules -->
<script type="module" src="js/firestore.js"></script>
<script type="module" src="js/index.js"></script>
</body>
</html>
