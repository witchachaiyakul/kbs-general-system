<section id="booking-view" class="panel app-view" hidden>
  <div class="section-heading">
    <div>
      <p class="eyebrow">เมนูหลัก / จองห้องประชุม</p>
      <h2>แบบฟอร์มขอใช้สถานที่</h2>
    </div>
    <button class="button button-secondary" type="button" data-view="home-view">กลับเมนูหลัก</button>
  </div>
  <form id="booking-form" class="form-grid">
    <label>
      ชื่อ-สกุลผู้จอง
      <input id="full-name" name="fullName" type="text" maxlength="120" autocomplete="name" required>
    </label>
    <label>
      ตำแหน่ง
      <select id="position" name="position" required>
        <option value="">เลือกตำแหน่ง</option>
        <option value="ครู">ครู</option>
        <option value="บุคลากรทางการศึกษา">บุคลากรทางการศึกษา</option>
        <option value="อื่นๆ">อื่นๆ</option>
      </select>
    </label>
    <label id="position-other-wrap" hidden>
      โปรดระบุตำแหน่ง
      <input id="position-other" name="positionOther" type="text" maxlength="100">
    </label>
    <label>
      เบอร์โทรศัพท์
      <input id="phone" name="phone" type="tel" inputmode="numeric" pattern="[0-9]{9,10}" maxlength="10" required>
    </label>
    <label>
      สถานที่
      <select id="location" name="location" required>
        <option value="">เลือกสถานที่</option>
      </select>
    </label>
    <label class="span-two">
      วัตถุประสงค์
      <input id="purpose" name="purpose" type="text" maxlength="500" required>
    </label>
    <label>
      วันและเวลาเริ่มใช้
      <input id="start-time" name="startTime" type="datetime-local" required>
    </label>
    <label>
      วันและเวลาสิ้นสุด
      <input id="end-time" name="endTime" type="datetime-local" required>
    </label>
    <fieldset class="span-two">
      <legend>วัสดุและอุปกรณ์</legend>
      <div class="check-grid">
        <label class="check-label"><input type="checkbox" name="equipment" value="เครื่องเสียง"> เครื่องเสียง</label>
        <label class="check-label"><input type="checkbox" name="equipment" value="Projector"> Projector</label>
        <label class="check-label"><input type="checkbox" name="equipment" value="คอมพิวเตอร์"> คอมพิวเตอร์</label>
        <label class="check-label"><input type="checkbox" name="equipment" value="จอภาพโปรเจคเตอร์"> จอภาพโปรเจคเตอร์</label>
        <label class="check-label"><input type="checkbox" name="equipment" value="ไมโครโฟน"> ไมโครโฟน</label>
        <label class="check-label"><input type="checkbox" name="equipment" value="ไม่ต้องการ"> ไม่ต้องการ</label>
      </div>
    </fieldset>
    <label>
      โต๊ะ (ตัว)
      <input id="tables" name="tables" type="number" min="0" max="500" value="0">
    </label>
    <label>
      เก้าอี้ (ตัว)
      <input id="chairs" name="chairs" type="number" min="0" max="5000" value="0">
    </label>
    <label class="agreement span-two">
      <input id="agreement" type="checkbox" required>
      <span>ข้าพเจ้าขอรับรองว่าจะใช้สถานที่และทรัพย์สินของโรงเรียนด้วยความระมัดระวัง</span>
    </label>
    <div class="span-two form-actions">
      <button id="submit-booking" class="button button-primary" type="submit">ส่งคำขอจอง</button>
    </div>
  </form>
</section>
