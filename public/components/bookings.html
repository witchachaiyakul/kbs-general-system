<section id="bookings-view" class="panel app-view" hidden>
  <div class="section-heading">
    <div>
      <p class="eyebrow">เมนูหลัก / ตรวจสอบรายการจอง</p>
      <h2>รายการจอง</h2>
      <p class="muted">แสดงรายการล่าสุดไม่เกิน 100 รายการ</p>
    </div>
    <div class="button-row">
      <button id="refresh-bookings" class="button button-secondary" type="button">โหลดข้อมูลใหม่</button>
      <button class="button button-secondary" type="button" data-view="home-view">กลับเมนูหลัก</button>
    </div>
  </div>
  <div class="filter-grid">
    <label>เดือน
      <select id="month-filter">
        <option value="">ทุกเดือน</option>
        <option value="0">มกราคม</option><option value="1">กุมภาพันธ์</option>
        <option value="2">มีนาคม</option><option value="3">เมษายน</option>
        <option value="4">พฤษภาคม</option><option value="5">มิถุนายน</option>
        <option value="6">กรกฎาคม</option><option value="7">สิงหาคม</option>
        <option value="8">กันยายน</option><option value="9">ตุลาคม</option>
        <option value="10">พฤศจิกายน</option><option value="11">ธันวาคม</option>
      </select>
    </label>
    <label>ปี
      <select id="year-filter"></select>
    </label>
  </div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>ผู้จอง</th><th>สถานที่</th><th>เริ่มใช้</th><th>สิ้นสุด</th><th>สถานะ</th></tr></thead>
      <tbody id="public-bookings"><tr><td colspan="5" class="empty-cell">กำลังโหลดข้อมูล...</td></tr></tbody>
    </table>
  </div>
</section>
