<section id="admin-view" class="panel app-view" hidden>
  <div class="section-heading">
    <div>
      <p class="eyebrow">เมนูหลัก / ผู้ดูแลระบบ</p>
      <h2>จัดการคำขอจอง</h2>
    </div>
    <button class="button button-secondary" type="button" data-view="home-view">กลับเมนูหลัก</button>
  </div>
  <div id="admin-login-view">
    <h3>เข้าสู่ระบบผู้ดูแล</h3>
    <form id="admin-login-form" class="login-form">
      <label>อีเมล
        <input id="admin-email" type="email" autocomplete="username" required>
      </label>
      <label>รหัสผ่าน
        <input id="admin-password" type="password" autocomplete="current-password" required>
      </label>
      <button class="button button-primary" type="submit">เข้าสู่ระบบ</button>
    </form>
  </div>

  <div id="admin-dashboard" hidden>
    <div class="section-heading">
      <div>
        <h3>รายการคำขอจอง</h3>
        <p id="admin-identity" class="muted"></p>
      </div>
      <div class="button-row">
        <button id="refresh-admin" class="button button-secondary" type="button">โหลดข้อมูลใหม่</button>
        <button id="admin-logout" class="button button-danger" type="button">ออกจากระบบ</button>
      </div>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>เริ่มใช้</th><th>ผู้จอง</th><th>โทรศัพท์</th><th>สถานที่ / วัตถุประสงค์</th><th>สถานะ</th><th>จัดการ</th></tr></thead>
        <tbody id="admin-bookings"><tr><td colspan="6" class="empty-cell">เข้าสู่ระบบเพื่อดูข้อมูล</td></tr></tbody>
      </table>
    </div>
  </div>
</section>
